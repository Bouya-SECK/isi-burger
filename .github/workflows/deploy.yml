name: ISI BURGER CI/CD

on:
  push:
    branches:
      - bouya_seck_burger

jobs:

  build:
    name: Build et Install
    runs-on: ubuntu-latest

    steps:
      - name: Pull du code
        uses: actions/checkout@v3

      - name: Installer PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_pgsql, zip

      - name: Installer les dependances Laravel
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Configurer env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Verifier Laravel
        run: php artisan --version

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Pull du code
        uses: actions/checkout@v3

      - name: Login Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build image Docker
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/isi-burger:latest .

      - name: Push image Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/isi-burger:latest
